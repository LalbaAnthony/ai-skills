name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Catalog tests
        run: node .github/scripts/checks.mjs tests

      - name: Validate the plugin marketplace
        run: node .github/scripts/checks.mjs marketplace

      - name: Check skill discovery
        run: node .github/scripts/checks.mjs discovery
