name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Catalog tests
        run: node --test tests/*.test.mjs

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.330

      - name: Validate the plugin marketplace
        run: claude plugin validate .

      - name: Check skill discovery
        run: npx -y skills@1.9.0 add . --list
